<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Contribution activity">
  <defs>
    <linearGradient id="sunset" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffb21e"/><stop offset="0.55" stop-color="#ff3d81"/><stop offset="1" stop-color="#7b3cff"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#ffb21e"/><stop offset="0.6" stop-color="#ff3d81"/><stop offset="1" stop-color="#7b3cff"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #f3eee6; }
      .muted { font-size: 12px; fill: #a8a1b4; }
      .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: bottom; }
      @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .fade { animation: fade .8s ease both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>
